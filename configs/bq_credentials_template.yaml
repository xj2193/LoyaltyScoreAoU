bigquery:
  # Each namespace is a fully qualified BigQuery `project.dataset` value.
  # Keep real values in configs/bq_credentials.yaml, which is ignored by Git.
  namespaces:
    output: ""
    omop: ""
    unioned_ehr: ""
    ehr: ""
    participant: ""
    mappings: ""
    survey: ""
  tables:
    # Fully qualified `project.dataset.table`; keep the internal name private.
    id_crosswalk: ""

omop_table_configs:
  OMOP_TABLE_PREFIX: ""
  ANALYSIS_END_DATE: "2022-06-01"

folders:
  QUERY_OUTPUT_FOLDER: "output_query"
  CSV_OUTPUT_FOLDER: "feature_csv_output"

analysis_configs:
  INTERCEPT: -0.010
  NORMALIZATION_SCALE: 1.012
  COHORT_TABLE: "loyalty_score_cohort"
  COHORT_LABEL_PREFIX: "loyalty_score"

lookback_years:
  LOOK_BACK_YEARS: [1,2,3,4,5,6,7]
